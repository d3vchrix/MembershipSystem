<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 sidebar p-4">
                <div class="text-center mb-4">
                    <div class="mb-2">
                        <img src="img/avatar.jpg" alt="Admin" class="rounded-circle" width="60" />
                    </div>
                    <strong>Administrator Name</strong>
                    <p class="small">
                        <span class="text-muted"> admin@gmail.com </span> <br>
                        <a class="text-decoration-none" href="admin-profile.html">View Profile</a>
                    </p>
                </div>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fa-solid fa-chart-pie"></i>Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="user-registration.html"><i class="fa-solid fa-user"></i>User</a></li>
                    <li class="nav-item"><a class="nav-link active" href="plan-management.html"><i class="fa-solid fa-calendar-check"></i>Plan</a></li>

                    <div class="card-body">
                        <form>
                            <div class="row mb-3">
                                <div class="col-md-4">
                                    <input type="text" class="form-control" placeholder="Plan Name">
                                </div>
                                <div class="col-md-4">
                                    <input type="number" class="form-control" placeholder="Price">
                                </div>
                                <div class="col-md-4">
                                    <input type="text" class="form-control" placeholder="Duration (e.g. 30 days)">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success">Add Plan</button>
