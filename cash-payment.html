<!-- cash-payment.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cash Payment</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container py-5">
    <div class="card">
      <div class="card-header bg-warning text-dark">Cash Payment Module</div>
      <div class="card-body">
        <form>
          <div class="row mb-3">
            <div class="col-md-4">
              <input type="text" class="form-control" placeholder="Member Name">
            </div>
            <div class="col-md-4">
              <input type="text" class="form-control" placeholder="Plan Availed">
            </div>
            <div class="col-md-4">
              <input type="number" class="form-control" placeholder="Amount Paid">
            </div>
          </div>
          <div class="mb-3">
            <input type="date" class="form-control" placeholder="Payment Date">
          </div>
          <button type="submit" class="btn btn-dark">Record Payment</button>
        </form>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
